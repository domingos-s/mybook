<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Good Life — Reader</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="reader-topbar">
    <h1>The Good Life</h1>
    <div class="topbar-actions">
      <button id="bookmarkBtn" class="bookmark-btn" type="button" aria-label="Save reading bookmark" title="Save bookmark">
        🔖 Save Bookmark
      </button>
      <span id="progressLabel" aria-live="polite">0%</span>
    </div>
  </header>

  <main class="reader-shell">
    <article id="readerContent" class="reader-content" aria-label="Book content"></article>
  </main>

  <script src="app.js"></script>
</body>
</html>
